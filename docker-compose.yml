services:
  postgres:
    image: postgres:16-alpine
    container_name: task-postgres
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  taskapi:
    build:
      context: .
      dockerfile: ./taskAPI/Dockerfile
    container_name: task-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=taskdb;Username=taskuser;Password=taskpass123"
      Jwt__Issuer: task4-api
      Jwt__Audience: task4-client
      Jwt__Key: "${JWT_KEY}"
      Jwt__ExpiresMinutes: 60
      App__PublicBaseUrl: "http://localhost:8080"
      Plunk__ApiKey: "${PLUNK_API_KEY}"
      Plunk__FromEmail: "${PLUNK_FROM_EMAIL:-noreply@example.com}"
      Plunk__FromName: "User Management"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: