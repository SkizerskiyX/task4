<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In — User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark app-navbar">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-shield-lock me-2"></i>User Management
            </span>
        </div>
    </nav>

    <main class="container page-content">
        <div class="auth-card">
            <div class="card">
                <div class="card-body p-4">
                    <h1 class="h4 mb-3"><i class="bi bi-box-arrow-in-right me-2"></i>Sign in</h1>
                    <div id="status-area" class="mb-3"></div>

                    <form id="login-form" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="email"
                                   placeholder="you@example.com" required autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password"
                                   placeholder="Any non-empty password" required autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-arrow-right-circle me-1"></i>Sign in
                        </button>
                    </form>

                    <p class="form-text-link mt-3 mb-0 text-center">
                        No account?
                        <a href="/register.html">Register</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
