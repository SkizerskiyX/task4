<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users — User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="users-page">
    <nav class="navbar navbar-dark app-navbar">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-shield-lock me-2"></i>User Management
            </span>
            <div class="d-flex align-items-center gap-3">
                <span id="current-user-label" class="small d-none d-md-inline"></span>
                <a class="nav-link text-white px-0" href="#" id="logout-link">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </a>
            </div>
        </div>
    </nav>

    <main class="container page-content">
        <div id="status-area"></div>

        <div class="toolbar d-flex flex-wrap align-items-center gap-2">
            <button type="button" class="btn btn-danger btn-sm" id="btn-block" disabled
                    data-bs-toggle="tooltip" data-bs-placement="top" title="Block selected users">
                Block
            </button>
            <button type="button" class="btn btn-success btn-sm" id="btn-unblock" disabled
                    data-bs-toggle="tooltip" data-bs-placement="top" title="Unblock selected users">
                <i class="bi bi-unlock"></i>
            </button>
            <button type="button" class="btn btn-secondary btn-sm" id="btn-delete" disabled
                    data-bs-toggle="tooltip" data-bs-placement="top" title="Delete selected users">
                <i class="bi bi-trash"></i>
            </button>
            <button type="button" class="btn btn-warning btn-sm" id="btn-delete-unverified" disabled
                    data-bs-toggle="tooltip" data-bs-placement="top" title="Delete selected unverified users">
                <i class="bi bi-person-x"></i>
            </button>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered align-middle">
                <thead>
                    <tr>
                        <th class="col-select">
                            <input class="form-check-input" type="checkbox" id="select-all"
                                   aria-label="Select all users" title="Select / deselect all">
                        </th>
                        <th><i class="bi bi-person me-1"></i>Name</th>
                        <th><i class="bi bi-envelope me-1"></i>Email</th>
                        <th><i class="bi bi-clock me-1"></i>Last login</th>
                        <th><i class="bi bi-calendar me-1"></i>Registered</th>
                        <th class="text-center"><i class="bi bi-info-circle me-1"></i>Status</th>
                    </tr>
                </thead>
                <tbody id="users-body">
                </tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/users.js"></script>
</body>
</html>
